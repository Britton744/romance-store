<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم Firebase</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#0f0f0f;--red:#e50914;--gold:#d4af37;--text:#fff;--muted:#888;--border:#222;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial;display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0}
.logo{text-align:center;color:var(--gold);font-weight:900;font-size:20px;margin-bottom:30px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:14px 20px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;background:none;border:0;width:100%;text-align:right;cursor:pointer;transition:0.2s}
.nav-btn:hover,.nav-btn.active{background:#e5091422;color:var(--red);border-right:4px solid var(--red)}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:15px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.content-area{padding:20px;overflow-y:auto;flex:1}
.view{display:none}
.view.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-card h2{margin:10px 0 0;color:var(--red);font-size:28px}
.stat-card span{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin-bottom:10px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;font-family:inherit}
label{font-size:13px;color:#bbb;display:block;margin-bottom:5px}
.btn{background:var(--red);color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;width:100%}
.btn:hover{background:#b20710}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.item img{width:50px;height:50px;border-radius:6px;object-fit:cover}
.actions button{background:#333;color:#fff;border:0;padding:6px 12px;border-radius:6px;margin-left:5px;cursor:pointer;font-size:12px}
.actions button.danger{background:#8b0000}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-left:0;border-bottom:1px solid var(--border)}
  .logo{display:none}
  .nav-btn{white-space:nowrap;border-right:0;border-bottom:3px solid transparent;padding:10px}
  .nav-btn.active{border-right:0;border-bottom:3px solid var(--red)}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">👑 لوحة التحكم</div>
  <button class="nav-btn active" data-target="dash">🏠 الرئيسية</button>
  <button class="nav-btn" data-target="products">🛍️ المنتجات</button>
  <button class="nav-btn" data-target="orders">📦 الطلبات</button>
  <button class="nav-btn" data-target="categories">📂 الأقسام</button>
</div>

<div class="main-content">
  <div class="top-bar">
    <h3 style="margin:0">إدارة المتجر (Firebase)</h3>
  </div>

  <div class="content-area">
    <div id="view-dash" class="view active">
      <div class="stats-grid">
        <div class="stat-card"><span>المنتجات</span><h2 id="stat-p">0</h2></div>
        <div class="stat-card"><span>الطلبات</span><h2 id="stat-o">0</h2></div>
        <div class="stat-card"><span>طلبات جديدة</span><h2 id="stat-n">0</h2></div>
        <div class="stat-card"><span>الزوار</span><h2>0</h2></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">مرحباً بك</h3>
        <p style="color:var(--muted)">يمكنك إدارة متجرك بالكامل من هنا. تأكد من أنك رفعت الصور بشكل صحيح.</p>
      </div>
    </div>

    <div id="view-products" class="view">
      <div class="card">
        <h3 style="margin-top:0">إضافة منتج جديد</h3>
        <input type="hidden" id="prod_id">
        <label>اسم المنتج</label><input id="prod_name" placeholder="اسم المنتج">
        <div class="grid-2">
          <div><label>السعر (ر.س)</label><input id="prod_price" type="number"></div>
          <div><label>القسم</label><select id="prod_cat"></select></div>
        </div>
        <label>الوصف</label><textarea id="prod_desc" rows="2"></textarea>
        <label>صورة المنتج (ارفع من جهازك)</label>
        <input id="prod_file" type="file" accept="image/*" style="padding:10px; background:#222">
        <button class="btn" onclick="saveProduct()" style="margin-top:15px">حفظ المنتج</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0">المنتجات الحالية</h3>
        <div id="list-products"></div>
      </div>
    </div>

    <div id="view-orders" class="view">
      <div class="card">
        <h3 style="margin-top:0">الطلبات</h3>
        <div id="list-orders">جاري التحميل...</div>
      </div>
    </div>

    <div id="view-categories" class="view">
      <div class="card">
        <h3 style="margin-top:0">إضافة قسم جديد</h3>
        <label>اسم القسم</label><input id="cat_name">
        <label>أيقونة (إيموجي)</label><input id="cat_icon" placeholder="مثال: 🎁">
        <button class="btn" onclick="saveCategory()" style="margin-top:15px">حفظ القسم</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0">الأقسام الحالية</h3>
        <div id="list-cats"></div>
      </div>
    </div>
  </div>
</div>
