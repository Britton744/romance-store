<script>
const SUPABASE_URL='https://rndgvtuteyasxrfkrlmv.supabase.co';
const SUPABASE_KEY='sb_publishable_Ao5OZFz_NU9tqIRlA8Z32A_GrYsCx8i';
const BUCKET='products-images';

let token=localStorage.getItem('romance_token')||'';
let refreshToken=localStorage.getItem('romance_refresh_token')||'';
let products=[],categories=[],orders=[];let orderFilter='all';let pendingFiles=[];let existingImages=[];let catFile=null;let catExisting='';let logoFile=null;let logoExisting='';let shareFile=null;let shareExisting='';let storeSettings=null;let currentInvoiceOrder=null;

function el(id){return document.getElementById(id)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toFixed(2)}
function headers(json){const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+(token||SUPABASE_KEY)};if(json)h['Content-Type']='application/json';return h}

// دالة تجديد التوكن تلقائياً
async function refreshSession() {
    if(!refreshToken) return false;
    try {
        const r = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', apikey: SUPABASE_KEY},
            body: JSON.stringify({refresh_token: refreshToken})
        });
        if(!r.ok) return false;
        const j = await r.json();
        token = j.access_token;
        refreshToken = j.refresh_token;
        localStorage.setItem('romance_token', token);
        localStorage.setItem('romance_refresh_token', refreshToken);
        return true;
    } catch(e) { return false; }
}

async function api(path,method,body){
    let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method:method||'GET',headers:headers(!!body),body:body?JSON.stringify(body):undefined});
    if(r.status===401 || r.status===403){
        let refreshed = await refreshSession();
        if(refreshed) {
            r = await fetch(SUPABASE_URL+'/rest/v1/'+path,{method:method||'GET',headers:headers(!!body),body:body?JSON.stringify(body):undefined});
        }
    }
    const txt=await r.text();let j=null;try{j=JSON.parse(txt)}catch(e){};
    if(!r.ok)throw new Error((j&&j.message)||txt||('HTTP '+r.status));return j
}

async function uploadFile(file,folder){
    const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=(folder||'products')+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+clean;
    let r=await fetch(SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+path,{
        method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':file.type||'image/jpeg'},body:file
    });
    if(r.status===401 || r.status===403){
        let refreshed = await refreshSession();
        if(refreshed) {
            r = await fetch(SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+path,{
                method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':file.type||'image/jpeg'},body:file
            });
        }
    }
    const txt=await r.text();
    if(!r.ok)throw new Error('فشل رفع الصورة: '+txt.slice(0,300));
    return SUPABASE_URL+'/storage/v1/object/public/'+BUCKET+'/'+path
}

function renderPThumbs(){el('pThumbs').innerHTML=[...existingImages.map((u,i)=>`<div class="thumb"><img src="${u}"><button data-del-exist="${i}">×</button></div>`),...pendingFiles.map((f,i)=>`<div class="thumb"><img src="${URL.createObjectURL(f)}"><button data-del-pend="${i}">×</button></div>`)].join('')}
function renderCThumb(){el('cThumbs').innerHTML='';if(catExisting)el('cThumbs').innerHTML+=`<div class="thumb"><img src="${catExisting}"><button id="delCatExist">×</button></div>`;if(catFile)el('cThumbs').innerHTML+=`<div class="thumb"><img src="${URL.createObjectURL(catFile)}"><button id="delCatPend">×</button></div>`}
function renderLogoThumb(){el('logoThumbs').innerHTML='';if(logoExisting)el('logoThumbs').innerHTML+=`<div class="thumb"><img src="${logoExisting}"><button id="delLogoExist">×</button></div>`;if(logoFile)el('logoThumbs').innerHTML+=`<div class="thumb"><img src="${URL.createObjectURL(logoFile)}"><button id="delLogoPend">×</button></div>`}
function renderShareThumb(){el('shareThumbs').innerHTML='';if(shareExisting)el('shareThumbs').innerHTML+=`<div class="thumb" style="width:140px;height:80px"><img src="${shareExisting}" style="width:140px;height:80px"><button id="delShareExist">×</button></div>`;if(shareFile)el('shareThumbs').innerHTML+=`<div class="thumb" style="width:140px;height:80px"><img src="${URL.createObjectURL(shareFile)}" style="width:140px;height:80px"><button id="delSharePend">×</button></div>`}
function parseItems(o){let items=o.items;if(typeof items==='string'){try{items=JSON.parse(items)}catch(e){items=[]}}if(!Array.isArray(items))items=[];return items.map(it=>{let name=it.name||it.product_name||it.title||'منتج';let price=Number(it.price||it.unit_price||0);let qty=Number(it.qty||it.quantity||1);let total=Number(it.total||it.line_total||price*qty);return {name,price,qty,total}})}

function buildInvoiceHTML(o){
  let items=parseItems(o);let subtotal=items.reduce((s,i)=>s+i.total,0);
  let delivery=Number(o.delivery_fee||o.shipping_cost||o.shipping||0);
  let discount=Number(o.discount||0);
  let grand=Number(o.total||0); if(!grand||grand===0) grand=subtotal+delivery-discount;
  let s=storeSettings||{};let logo=s.logo_url||logoExisting||'';
  let rows=items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.name)}</td><td>${it.qty}</td><td>${fmt(it.price)} ر.س</td><td>${fmt(it.total)} ر.س</td></tr>`).join('')||'<tr><td colspan="5">لا توجد تفاصيل عناصر محفوظة لهذا الطلب.</td></tr>';
  return `<div class="invoice"><div class="inv-head"><div><h2>${esc(s.store_name||'متجر الرومانسية')}</h2><p style="margin:4px 0;color:#555">${esc(s.store_name_en||'ROMANCE STORE')}</p><p style="margin:2px 0;font-size:13px">📞 ${esc(s.phone||'')} | ✉️ ${esc(s.email||'')}</p><p style="margin:2px 0;font-size:13px">📍 ${esc(s.about_text||'')}</p></div>${logo?`<img src="${logo}">`:''}</div>
  <hr><div style="display:flex;justify-content:space-between"><div><b>فاتورة رقم:</b> ${esc(o.order_number||String(o.id).slice(0,8))}<br><b>التاريخ:</b> ${o.created_at?new Date(o.created_at).toLocaleString('ar'):''}<br><b>الحالة:</b> ${esc(o.status||'')}</div><div><b>العميل:</b> ${esc(o.customer_name||'')}<br><b>الجوال:</b> ${esc(o.phone||'')}<br><b>المدينة:</b> ${esc(o.city||'')} - ${esc(o.district||'')}<br><b>العنوان:</b> ${esc(o.address||'')} ${esc(o.national_address||'')}</div></div>
  <table><thead><tr><th>#</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${rows}</tbody></table>
  <div style="text-align:left"><p>المجموع الفرعي: <b>${fmt(subtotal)} ر.س</b></p>${delivery?`<p>التوصيل: <b>${fmt(delivery)} ر.س</b></p>`:''}${discount?`<p>الخصم: <b>-${fmt(discount)} ر.س</b></p>`:''}<p class="tot" style="font-size:18px;border-top:2px solid #111;padding-top:8px">الإجمالي النهائي: ${fmt(grand)} ر.س</p></div>
  <div class="inv-foot">شكراً لطلبك من ${esc(s.store_name||'متجر الرومانسية')} 💖<br>${esc(s.announcement||'')} - للاستفسار واتساب: ${esc(s.whatsapp||s.phone||'')}</div></div>`;
}

function showInvoice(id){let o=orders.find(x=>x.id===id);if(!o)return;currentInvoiceOrder=o;el('invoiceContent').innerHTML=buildInvoiceHTML(o);el('invoiceModal').classList.remove('hidden')}

async function login(){
    const btn=el('loginBtn');const email=el('email').value.trim(),password=el('password').value;
    if(!email||!password){el('loginMsg').textContent='أدخل البريد وكلمة المرور.';return}
    btn.disabled=true;btn.textContent='جارٍ تسجيل الدخول...';
    try{
        const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({email,password})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(j.error_description||'تعذر الدخول');
        token=j.access_token;
        refreshToken=j.refresh_token;
        localStorage.setItem('romance_token',token);
        localStorage.setItem('romance_refresh_token',refreshToken);
        el('adminEmail').textContent=j.user?.email||email;
        await enter()
    }catch(e){el('loginMsg').textContent='تعذر الدخول: '+e.message}
    finally{btn.disabled=false;btn.textContent='دخول لوحة التحكم'}
}

async function enter(){el('loginBox').classList.add('hidden');el('app').classList.remove('hidden');try{await refresh()}catch(e){alert('تم الدخول، لكن تعذر تحميل البيانات: '+e.message)}}
function logout(){localStorage.removeItem('romance_token');localStorage.removeItem('romance_refresh_token');location.reload()}
function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));el(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
async function refresh(){await Promise.all([loadProducts(),loadCats(),loadOrders(),loadSettings(),loadVisitors()]);renderDash()}

function renderDash(){el('pcount').textContent=products.length;el('ocount').textContent=orders.length;el('newcount').textContent=orders.filter(o=>o.status==='جديد').length;let low=products.filter(p=>Number(p.stock||0)<=3);el('lowStock').innerHTML=low.map(p=>`<div class="item"><div class="grow"><b>${esc(p.name)}</b> - مخزون ${p.stock}</div><button class="btn btnsm" data-ep="${p.id}">تعديل</button></div>`).join('')||'المخزون ممتاز 👌';el('recentOrders').innerHTML=orders.slice(0,5).map(o=>`<div class="item"><div class="grow"><b>طلب #${o.order_number||String(o.id).slice(0,6)}</b> · ${esc(o.customer_name)}<br><span class="muted">${esc(o.city||'')} · ${o.total} ر.س</span></div><span class="pill">${esc(o.status)}</span><button class="btn btnsm" data-inv="${o.id}">🧾 فاتورة</button></div>`).join('')||'لا توجد طلبات بعد.'}

async function loadProducts(){products=await api('products?select=*&order=created_at.desc');let q=(el('searchP').value||'').trim();let list=products.filter(p=>!q||p.name.includes(q));el('plist').innerHTML=list.map(p=>`<div class="item">${p.images?.[0]?`<img src="${p.images[0]}">`:''}<div class="grow"><b>${esc(p.name)}</b><br><span class="muted">${p.price} ر.س · مخزون ${p.stock} · صور: ${(p.images||[]).length}</span><div class="flex" style="margin-top:8px"><button class="btn btnsm" data-ep="${p.id}">تعديل</button><button class="btn btnsm danger" data-dp="${p.id}">حذف</button></div></div></div>`).join('')||'لا توجد منتجات.'}
async function loadCats(){categories=await api('categories?select=*&order=sort_order.asc');el('pcat').innerHTML='<option value="">بدون قسم</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');el('clist').innerHTML=categories.map(c=>`<div class="item">${c.image_url?`<img src="${c.image_url}">`:''}<div class="grow"><b>${esc(c.name)}</b><br><span class="muted">${esc(c.description||'')}</span></div><div class="flex"><button class="btn btnsm" data-ec="${c.id}">تعديل</button><button class="btn btnsm danger" data-dc="${c.id}">حذف</button></div></div>`).join('')}

async function saveProduct(){
    try{
        let btn=el('saveProductBtn');btn.disabled=true;btn.textContent='جارٍ رفع الصور...';
        let images=[...existingImages,...el('purls').value.split('\n').map(x=>x.trim()).filter(Boolean)];
        for(let i=0;i<pendingFiles.length;i++){
            el('pProgress').style.width=Math.round(((i+1)/pendingFiles.length)*100)+'%';
            images.push(await uploadFile(pendingFiles[i],'products'))
        }
        images=images.slice(0,5);if(images.length<1)throw Error('اختر صورة واحدة على الأقل');
        let payload={name:el('pname').value.trim(),description:el('pdesc').value,price:Number(el('pprice').value||0),stock:Number(el('pstock').value||0),category_id:el('pcat').value||null,images,active:el('pactive').checked,featured:el('pfeatured').checked,updated_at:new Date().toISOString()};
        if(!payload.name)throw Error('اكتب اسم المنتج');
        let id=el('pid').value;if(id)await api('products?id=eq.'+id,'PATCH',payload);else await api('products','POST',payload);
        clearProduct();await loadProducts();renderDash();alert('✅ تم حفظ المنتج مع '+images.length+' صور')
    }catch(e){alert('تعذر الحفظ: '+e.message)}
    finally{let b=el('saveProductBtn');b.disabled=false;b.textContent='💾 حفظ المنتج مع الصور';el('pProgress').style.width='0%'}
}

function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;tab('products',document.querySelector('[data-tab="products"]'));el('pid').value=p.id;el('pname').value=p.name;el('pdesc').value=p.description||'';el('pprice').value=p.price;el('pstock').value=p.stock;el('pcat').value=p.category_id||'';existingImages=[...(p.images||[])];pendingFiles=[];el('purls').value='';el('pactive').checked=p.active;el('pfeatured').checked=p.featured;renderPThumbs();window.scrollTo(0,0)}
function clearProduct(){['pid','pname','pdesc','pprice','pstock','purls'].forEach(x=>el(x).value='');el('pactive').checked=true;el('pfeatured').checked=false;pendingFiles=[];existingImages=[];el('pimages').value='';renderPThumbs()}
async function deleteProduct(id){if(!confirm('حذف المنتج نهائياً؟'))return;try{await api('products?id=eq.'+id,'DELETE');await loadProducts();renderDash()}catch(e){alert(e.message)}}

async function saveCategory(){
    try{
        let img=catExisting;if(catFile)img=await uploadFile(catFile,'categories');
        let payload={name:el('cname').value.trim(),description:el('cdesc').value,image_url:img||null,slug:el('cname').value.trim().toLowerCase().replace(/\s+/g,'-')};
        if(!payload.name)throw Error('اكتب اسم القسم');
        let id=el('cid').value;if(id)await api('categories?id=eq.'+id,'PATCH',payload);else await api('categories','POST',payload);
        clearCategory();await loadCats();alert('✅ تم حفظ القسم')
    }catch(e){alert(e.message)}
}

function editCategory(id){let c=categories.find(x=>x.id===id);if(!c)return;el('cid').value=c.id;el('cname').value=c.name;el('cdesc').value=c.description||'';catExisting=c.image_url||'';catFile=null;renderCThumb()}
function clearCategory(){el('cid').value=el('cname').value=el('cdesc').value='';el('cimage').value='';catFile=null;catExisting='';renderCThumb()}
async function deleteCategory(id){if(!confirm('حذف القسم؟'))return;try{await api('categories?id=eq.'+id,'DELETE');await loadCats()}catch(e){alert(e.message)}}

function renderOrders(){let q=(el('searchO').value||'').trim();let list=orders.filter(o=>(orderFilter==='all'||o.status===orderFilter)&&(!q||(o.customer_name||'').includes(q)||(o.phone||'').includes(q)));el('olist').innerHTML=list.map(o=>{let items=parseItems(o);let sub=items.reduce((s,i)=>s+i.total,0);return `<div class="item"><div class="grow"><b>طلب #${o.order_number||String(o.id).slice(0,6)}</b> · ${esc(o.customer_name)} · ${esc(o.phone)}<br><span class="muted">${esc(o.city||'')} · المجموع المسجل: ${fmt(o.total)} ر.س · مجموع العناصر المحسوب: ${fmt(sub)} ر.س</span><br><span class="pill">${esc(o.status)}</span><div class="flex" style="margin-top:8px"><select id="status-${o.id}" style="max-width:180px"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='تم الشحن'?'selected':''}>تم الشحن</option><option ${o.status==='مكتمل'?'selected':''}>مكتمل</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select><button class="btn btnsm" data-uo="${o.id}">تحديث</button><button class="btn btnsm" data-inv="${o.id}">🧾 عرض الفاتورة</button><button class="btn btnsm btn2" data-wa="${o.id}">واتساب العميل</button></div></div></div>`}).join('')||'لا توجد طلبات بعد.'}
async function loadOrders(){orders=await api('orders?select=*&order=created_at.desc');renderOrders()}
async function updateOrder(id){try{await api('orders?id=eq.'+id,'PATCH',{status:el('status-'+id).value});await loadOrders();renderDash();alert('تم تحديث الطلب')}catch(e){alert(e.message)}}

async function loadSettings(){
    let s=(await api('store_settings?select=*&id=eq.1'))[0];if(!s)return;storeSettings=s;
    el('sname').value=s.store_name||'';el('snameen').value=s.store_name_en||'';el('sphone').value=s.phone||'';el('swa').value=s.whatsapp||'';el('semail').value=s.email||'';logoExisting=s.logo_url||'';shareExisting=s.share_image_url||s.page_background_url||'';el('sstoreUrl').value=s.store_url||'';el('stitle').value=s.hero_title||'';el('sdesc').value=s.hero_description||'';el('sabout').value=s.about_text||'';el('sannounce').value=s.announcement||'';el('sbg').value=s.page_background_url||'';el('storeLink').value=s.store_url||'';renderLogoThumb();renderShareThumb()
}

async function saveSettings(){
    try{
        let btn=el('saveSettingsBtn');btn.disabled=true;btn.textContent='جارٍ رفع الشعار والصورة...';
        let logo=logoExisting;if(logoFile)logo=await uploadFile(logoFile,'logo');
        let share=shareExisting;if(shareFile)share=await uploadFile(shareFile,'share');
        let payload={store_name:el('sname').value,store_name_en:el('snameen').value,phone:el('sphone').value,whatsapp:el('swa').value,email:el('semail').value,logo_url:logo,share_image_url:share,store_url:el('sstoreUrl').value,hero_title:el('stitle').value,hero_description:el('sdesc').value,about_text:el('sabout').value,announcement:el('sannounce').value,page_background_url:el('sbg').value,updated_at:new Date().toISOString()};
        await api('store_settings?id=eq.1','PATCH',payload);
        storeSettings={...storeSettings,...payload};el('storeLink').value=payload.store_url||'';alert('✅ تم حفظ الإعدادات والشعار')
    }catch(e){alert('تعذر الحفظ: '+e.message)}
    finally{let b=el('saveSettingsBtn');b.disabled=false;b.textContent='💾 حفظ الإعدادات والشعار وصورة الرابط'}
}

async function loadVisitors(){try{const r=await fetch(SUPABASE_URL+'/rest/v1/visitor_events?select=id',{headers:{...headers(),Prefer:'count=exact'},method:'HEAD'});let n=r.headers.get('content-range');let count=n?n.split('/')[1]:'0';el('vcount').textContent=count;el('visitorTotal').textContent='إجمالي الزيارات: '+count}catch(e){}}

function copyStore(){let link=el('storeLink').value||el('sstoreUrl').value||'';if(!link){alert('أدخل رابط المتجر في الإعدادات أولاً');tab('settings',document.querySelector('[data-tab="settings"]'));return}navigator.clipboard.writeText(link).then(()=>alert('✅ تم نسخ رابط المتجر\n'+link)).catch(()=>prompt('انسخ الرابط:',link))}

el('dropP').addEventListener('click',()=>el('pimages').click());el('dropC').addEventListener('click',()=>el('cimage').click());el('dropLogo').addEventListener('click',()=>el('slogoFile').click());el('dropShare').addEventListener('click',()=>el('sshareFile').click());
el('pimages').addEventListener('change',e=>{pendingFiles.push(...[...e.target.files].slice(0,5-existingImages.length-pendingFiles.length));renderPThumbs();e.target.value=''});
el('cimage').addEventListener('change',e=>{catFile=e.target.files[0]||null;renderCThumb();e.target.value=''});
el('slogoFile').addEventListener('change',e=>{logoFile=e.target.files[0]||null;renderLogoThumb();e.target.value=''});
el('sshareFile').addEventListener('change',e=>{shareFile=e.target.files[0]||null;renderShareThumb();e.target.value=''});

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tab)tab(t.dataset.tab,t);if(t.dataset.ep)editProduct(t.dataset.ep);if(t.dataset.dp)deleteProduct(t.dataset.dp);if(t.dataset.ec)editCategory(t.dataset.ec);if(t.dataset.dc)deleteCategory(t.dataset.dc);if(t.dataset.uo)updateOrder(t.dataset.uo);if(t.dataset.inv)showInvoice(t.dataset.inv);if(t.dataset.ofilter){orderFilter=t.dataset.ofilter;renderOrders()}if(t.dataset.wa){let o=orders.find(x=>x.id===t.dataset.wa);if(o)window.open('https://wa.me/'+(o.phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent('أهلاً '+o.customer_name+'، طلبك رقم '+(o.order_number||'')+' حالته: '+o.status+' - متجر الرومانسية'),' _blank')}if(t.dataset.delExist!==undefined){existingImages.splice(Number(t.dataset.delExist),1);renderPThumbs()}if(t.dataset.delPend!==undefined){pendingFiles.splice(Number(t.dataset.delPend),1);renderPThumbs()}if(t.id==='delCatExist'){catExisting='';renderCThumb()}if(t.id==='delCatPend'){catFile=null;renderCThumb()}if(t.id==='delLogoExist'){logoExisting='';renderLogoThumb()}if(t.id==='delLogoPend'){logoFile=null;renderLogoThumb()}if(t.id==='delShareExist'){shareExisting='';renderShareThumb()}if(t.id==='delSharePend'){shareFile=null;renderShareThumb()}});

el('loginBtn').addEventListener('click',login);el('logoutBtn').addEventListener('click',logout);
el('copyStoreBtn').addEventListener('click',copyStore);el('copyStoreBtn2').addEventListener('click',copyStore);
el('waShareBtn').addEventListener('click',()=>{let link=el('storeLink').value;if(!link){alert('أدخل رابط المتجر أولاً');return}window.open('https://wa.me/?text='+encodeURIComponent('💖 متجر الرومانسية\n'+link),'_blank')});
el('saveProductBtn').addEventListener('click',saveProduct);el('clearProductBtn').addEventListener('click',clearProduct);
el('saveCategoryBtn').addEventListener('click',saveCategory);el('clearCategoryBtn').addEventListener('click',clearCategory);
el('saveSettingsBtn').addEventListener('click',saveSettings);
el('closeInvoice').addEventListener('click',()=>el('invoiceModal').classList.add('hidden'));
el('waInvoice').addEventListener('click',()=>{if(!currentInvoiceOrder)return;let o=currentInvoiceOrder;let items=parseItems(o);let txt='🧾 فاتورة متجر الرومانسية\nرقم الطلب: '+(o.order_number||'')+'\nالعميل: '+o.customer_name+'\n'+items.map(i=>i.name+' × '+i.qty+' = '+fmt(i.total)+' ر.س').join('\n')+'\nالإجمالي: '+fmt(o.total)+' ر.س';window.open('https://wa.me/'+(o.phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(txt),'_blank')});
el('searchP').addEventListener('input',loadProducts);el('searchO').addEventListener('input',renderOrders);
el('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
renderPThumbs();renderCThumb();renderLogoThumb();renderShareThumb();
if(token){
    el('adminEmail').textContent='مسجل دخول';
    enter().catch(()=>{token='';refreshToken='';localStorage.removeItem('romance_token');localStorage.removeItem('romance_refresh_token')})
}
</script>
