<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم المتجر</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root{--bg:#050505;--panel:#111;--red:#e50914;--gold:#d4af37;--text:#fff;--border:#252525}
*{box-sizing:border-box; font-family:Tajawal,system-ui}
body{margin:0;background:var(--bg);color:var(--text);padding:15px; padding-bottom:50px;}
.hidden{display:none!important;} .wrap{max-width:600px;margin:auto;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:15px;}
h2{text-align:center; color:var(--gold); margin-bottom:20px;}
input,select,textarea{width:100%;padding:12px;background:#000;color:#fff;border:1px solid #333;border-radius:8px;margin-bottom:12px; outline:none;}
input:focus{border-color:var(--red);}
label{font-size:13px; color:#aaa; display:block; margin-bottom:5px;}
.btn{background:var(--red);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%; margin-top:5px; font-size:16px;}
.btn:hover{background:#b80710;}
.btn-dark{background:#222; color:#fff;}
.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
.menu-btn{background:var(--panel); border:1px solid var(--border); color:#fff; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer; text-align:center; font-size:15px;}
.menu-btn.active{background:var(--red); border-color:var(--red);}
#status{text-align:center; color:#ffb0b0; font-size:14px; margin-bottom:15px; padding:10px; border-radius:8px; background:#1a0000; border:1px solid #500;}
.item{display:flex; align-items:center; gap:10px; background:#080808; border:1px solid #222; padding:10px; border-radius:10px; margin-bottom:10px;}
.item img{width:50px;height:50px; object-fit:cover; border-radius:8px;}
.item-info{flex:1;}
.item-info h4{font-size:14px; margin:0 0 5px;}
.item-info span{color:var(--red); font-size:13px;}
.actions{display:flex; gap:5px;}
.actions button{padding:6px 10px; border:none; border-radius:6px; cursor:pointer; font-size:12px; color:#fff;}
.btn-edit{background:#333;} .btn-del{background:#800000;}
</style>
</head>
<body>
<div class="wrap">
    
    <h2>👑 لوحة تحكم المتجر</h2>
    <div id="status">مرحباً، جاري التحقق من الدخول...</div>

    <div id="loginBox" class="card">
        <label>البريد الإلكتروني للمدير</label>
        <input id="email" value="roooo77775@gmail.com">
        <label>كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••">
        <button class="btn" onclick="doLogin()">دخول</button>
    </div>

    <div id="app" class="hidden">
        <div class="menu-grid">
            <button class="menu-btn active" onclick="showTab('prods', this)">🛍️ المنتجات</button>
            <button class="menu-btn" onclick="showTab('cats', this)">📂 الأقسام</button>
            <button class="menu-btn" onclick="showTab('ords', this)">📦 الطلبات</button>
            <button class="menu-btn" onclick="doLogout()">🚪 خروج</button>
        </div>

        <!-- المنتجات -->
        <div id="prods" class="card">
            <h3 style="color:var(--gold); margin-top:0;">إضافة / تعديل منتج</h3>
            <input type="hidden" id="pid">
            <label>اسم المنتج</label><input id="pname" placeholder="اسم المنتج">
            <label>السعر</label><input id="pprice" type="number" placeholder="السعر">
            <label>المخزون</label><input id="pstock" type="number" value="10">
            <label>الوصف</label><textarea id="pdesc" rows="2" placeholder="وصف المنتج..."></textarea>
            <label>القسم</label><select id="pcat"><option value="">بدون قسم</option></select>
            <label>صورة المنتج</label><input type="file" id="pimages" accept="image/*">
            <button class="btn" onclick="doSaveProduct()">💾 حفظ المنتج</button>
            <button class="btn btn-dark" onclick="clearP()">مسح الحقول</button>
            
            <hr style="border-color:#333; margin:20px 0;">
            <h3 style="color:var(--gold); margin-top:0;">المنتجات المضافة</h3>
            <div id="plist"></div>
        </div>

        <!-- الأقسام -->
        <div id="cats" class="card hidden">
            <h3 style="color:var(--gold); margin-top:0;">إضافة قسم جديد</h3>
            <label>اسم القسم</label><input id="cname" placeholder="مثال: ألعاب زوجية">
            <button class="btn" onclick="doSaveCat()">💾 حفظ القسم</button>
            <hr style="border-color:#333; margin:20px 0;">
            <div id="clist"></div>
        </div>

        <!-- الطلبات -->
        <div id="ords" class="card hidden">
            <h3 style="color:var(--gold); margin-top:0;">الطلبات الواردة</h3>
            <div id="olist"></div>
        </div>
    </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyDWtBaLMtKzk9m4PdD3gOS281WCIMXf-fM",authDomain:"romance-store.firebaseapp.com",projectId:"romance-store",storageBucket:"romance-store.firebasestorage.app",messagingSenderId:"515216718722",appId:"1:515216718722:web:0acd950bef30a661886d9b",measurementId:"G-07KBTXL09Y"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let products=[], categories=[], orders=[], pendingFile=null;

function setStatus(t){ document.getElementById('status').textContent=t; }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showTab(id, btn){
    ['prods','cats','ords'].forEach(x=>document.getElementById(x).classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
}

async function doLogin(){
    setStatus('جارٍ الدخول...');
    let em=document.getElementById('email').value.trim();
    try{ await auth.signInWithEmailAndPassword(em, document.getElementById('password').value); }
    catch(e){ setStatus('❌ فشل الدخول: '+e.message); }
}

async function doLogout(){ await auth.signOut(); location.reload(); }

auth.onAuthStateChanged(async u=>{
    if(!u){
        document.getElementById('app').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        setStatus('يرجى تسجيل الدخول');
        return;
    }
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    setStatus('✅ أهلاً '+u.email);
    await loadAll();
});

async function loadAll(){
    try{ let s=await db.collection('products').get(); products=s.docs.map(d=>({id:d.id,...d.data()})); renderProds(); }catch(e){ setStatus('❌ خطأ في جلب المنتجات: '+e.message); }
    try{ let s=await db.collection('categories').get(); categories=s.docs.map(d=>({id:d.id,...d.data()})); renderCats(); }catch(e){}
    try{ let s=await db.collection('orders').get(); orders=s.docs.map(d=>({id:d.id,...d.data()})); renderOrds(); }catch(e){}
}

function renderProds(){
    document.getElementById('plist').innerHTML = products.map(p=>`
        <div class="item">
            ${p.images&&p.images[0]?'<img src="'+esc(p.images[0])+'">':'<div style="width:50px;height:50px;background:#222;border-radius:8px;"></div>'}
            <div class="item-info"><h4>${esc(p.name)}</h4><span>${esc(p.price)} ر.س</span></div>
            <div class="actions"><button class="btn-edit" onclick="editP('${p.id}')">تعديل</button><button class="btn-del" onclick="delP('${p.id}')">حذف</button></div>
        </div>`).join('') || '<p style="color:#888;">لا توجد منتجات</p>';
}

function renderCats(){
    document.getElementById('pcat').innerHTML = '<option value="">بدون قسم</option>' + categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    document.getElementById('clist').innerHTML = categories.map(c=>`<div class="item"><div class="item-info"><h4>${esc(c.name)}</h4></div><button class="btn-del" onclick="delC('${c.id}')">حذف</button></div>`).join('') || '<p style="color:#888;">لا توجد أقسام</p>';
}

function renderOrds(){
    document.getElementById('olist').innerHTML = orders.map(o=>`
        <div class="item">
            <div class="item-info"><h4>${esc(o.customer_name)}</h4><span>${esc(o.total)} ر.س</span></div>
            <select onchange="updOrd('${o.id}',this.value)" style="width:100px; margin:0; padding:5px; font-size:12px;">
                <option ${o.status==='جديد'?'selected':''}>جديد</option>
                <option ${o.status==='مكتمل'?'selected':''}>مكتمل</option>
            </select>
        </div>`).join('') || '<p style="color:#888;">لا توجد طلبات</p>';
}

async function doSaveProduct(){
    let name=document.getElementById('pname').value.trim();
    if(!name) return setStatus('اكتب اسم المنتج');
    setStatus('جارٍ الحفظ...');
    let payload={ name, price:Number(document.getElementById('pprice').value||0), stock:Number(document.getElementById('pstock').value||0), description:document.getElementById('pdesc').value, category_id:document.getElementById('pcat').value||null, images:[], active:true };
    
    try{
        let id=document.getElementById('pid').value;
        let ref;
        if(id){ await db.collection('products').doc(id).update(payload); ref={id}; }
        else { ref=await db.collection('products').add(payload); }
        
        if(pendingFile){
            let fileRef = storage.ref('products/'+Date.now()+'-'+pendingFile.name);
            await fileRef.put(pendingFile);
            let url = await fileRef.getDownloadURL();
            await db.collection('products').doc(ref.id).update({images:[url]});
        }
        setStatus('✅ تم حفظ المنتج بنجاح');
        clearP(); await loadAll();
    }catch(e){ setStatus('❌ فشل الحفظ: '+e.message); }
}

function editP(id){ let p=products.find(x=>x.id===id); if(!p)return; document.getElementById('pid').value=p.id; document.getElementById('pname').value=p.name; document.getElementById('pprice').value=p.price; document.getElementById('pstock').value=p.stock; document.getElementById('pdesc').value=p.description||''; }
function clearP(){ ['pid','pname','pprice','pdesc'].forEach(x=>document.getElementById(x).value=''); document.getElementById('pstock').value='10'; pendingFile=null; document.getElementById('pimages').value=''; }
async function delP(id){ if(confirm('حذف المنتج؟')){ await db.collection('products').doc(id).delete(); loadAll(); } }

async function doSaveCat(){
    let n=document.getElementById('cname').value.trim();
    if(!n) return setStatus('اكتب اسم القسم');
    try{ await db.collection('categories').add({name:n}); setStatus('✅ تم حفظ القسم'); document.getElementById('cname').value=''; await loadAll(); }
    catch(e){ setStatus('❌ فشل: '+e.message); }
}
async function delC(id){ if(confirm('حذف القسم؟')){ await db.collection('categories').doc(id).delete(); loadAll(); } }
async function updOrd(id,st){ await db.collection('orders').doc(id).update({status:st}); loadAll(); }

document.getElementById('pimages').addEventListener('change', e=>{ pendingFile=e.target.files[0]; });
</script>
</body>
</html>
