<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم المدير</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root{--bg:#050505;--panel:#111;--red:#e50914;--gold:#d4af37;--text:#fff;--border:#252525}
*{box-sizing:border-box; font-family:system-ui, sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:50px;}
.hidden{display:none!important;} .wrap{max-width:600px;margin:auto;padding:15px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:15px;}
h2{text-align:center; color:var(--gold); margin-bottom:15px;}
input,select,textarea{width:100%;padding:12px;background:#000;color:#fff;border:1px solid #333;border-radius:8px;margin-bottom:10px; outline:none;}
input:focus{border-color:var(--red);}
label{font-size:13px; color:#aaa; display:block; margin-bottom:5px; font-weight:bold;}
.btn{background:var(--red);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%; font-size:16px; margin-top:5px;}
.btn-dark{background:#222;}
.menu-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-bottom:15px;}
.menu-btn{background:#1a1a1a; border:1px solid #333; color:#ccc; padding:10px 5px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px; text-align:center;}
.menu-btn.active{background:var(--red); color:#fff; border-color:var(--red);}
#status{text-align:center; font-size:14px; margin-bottom:15px; padding:10px; border-radius:8px; background:#1a0000; border:1px solid #500; color:#ffb0b0; display:none;}
.item{display:flex; align-items:center; gap:10px; background:#0a0a0a; border:1px solid #222; padding:10px; border-radius:10px; margin-bottom:10px;}
.item img{width:60px;height:60px; object-fit:cover; border-radius:8px; border:1px solid #333;}
.item-info{flex:1;}
.item-info h4{font-size:14px; margin:0 0 5px;}
.item-info span{color:var(--red); font-size:13px; font-weight:bold;}
.actions{display:flex; flex-direction:column; gap:5px;}
.actions button{padding:6px 10px; border:none; border-radius:6px; cursor:pointer; font-size:12px; color:#fff;}
.btn-edit{background:#333;} .btn-del{background:#800000;}
.thumb-preview {width:100px; height:100px; object-fit:cover; border-radius:8px; border:2px solid var(--red); display:none; margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
    <h2>👑 لوحة إدارة المتجر</h2>
    <div id="status">مرحباً</div>

    <!-- تسجيل الدخول -->
    <div id="loginBox" class="card">
        <label>البريد الإلكتروني</label>
        <input id="email" value="roooo77775@gmail.com">
        <label>كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••">
        <button class="btn" onclick="doLogin()">دخول</button>
    </div>

    <!-- التطبيق -->
    <div id="app" class="hidden">
        <div class="menu-grid">
            <button class="menu-btn active" onclick="showTab('prods', this)">🛍️ المنتجات</button>
            <button class="menu-btn" onclick="showTab('cats', this)">📂 الأقسام</button>
            <button class="menu-btn" onclick="showTab('ords', this)">📦 الطلبات</button>
            <button class="menu-btn" style="grid-column: span 3; background:#800000; color:#fff; margin-top:5px;" onclick="doLogout()">🚪 تسجيل خروج</button>
        </div>

        <!-- قسم المنتجات -->
        <div id="prods" class="card">
            <h3 style="color:var(--gold); margin-top:0;">إضافة / تعديل منتج</h3>
            <input type="hidden" id="pid">
            
            <label>اسم المنتج</label>
            <input id="pname" placeholder="مثال: هدية فاخرة">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1"><label>السعر</label><input id="pprice" type="number"></div>
                <div style="flex:1"><label>المخزون</label><input id="pstock" type="number" value="10"></div>
            </div>
            
            <label>الوصف</label>
            <textarea id="pdesc" rows="2"></textarea>
            
            <label>القسم</label>
            <select id="pcat"><option value="">بدون قسم</option></select>
            
            <label>صورة المنتج</label>
            <input type="file" id="pimages" accept="image/*">
            <img id="previewImg" class="thumb-preview">
            
            <button class="btn" onclick="doSaveProduct()">💾 حفظ المنتج (مع الصورة)</button>
            <button class="btn btn-dark" onclick="clearP()">مسح الحقول</button>
            
            <hr style="border-color:#333; margin:20px 0;">
            <h3 style="color:var(--gold);">المنتجات المضافة</h3>
            <div id="plist"></div>
        </div>

        <!-- قسم الأقسام -->
        <div id="cats" class="card hidden">
            <h3 style="color:var(--gold); margin-top:0;">إضافة قسم جديد</h3>
            <label>اسم القسم</label>
            <input id="cname" placeholder="مثال: ألعاب زوجية">
            <button class="btn" onclick="doSaveCat()">💾 حفظ القسم</button>
            <hr style="border-color:#333; margin:20px 0;">
            <h3 style="color:var(--gold);">الأقسام الحالية</h3>
            <div id="clist"></div>
        </div>

        <!-- قسم الطلبات -->
        <div id="ords" class="card hidden">
            <h3 style="color:var(--gold); margin-top:0;">الطلبات الواردة</h3>
            <div id="olist"></div>
        </div>
    </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyDWtBaLMtKzk9m4PdD3gOS281WCIMXf-fM",authDomain:"romance-store.firebaseapp.com",projectId:"romance-store",storageBucket:"romance-store.firebasestorage.app",messagingSenderId:"515216718722",appId:"1:515216718722:web:0acd950bef30a661886d9b",measurementId:"G-07KBTXL09Y"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let products=[], categories=[], orders=[], pendingFile=null;

function setStatus(t, isError=false){ 
    let el = document.getElementById('status');
    el.style.display='block'; 
    el.textContent=t; 
    el.style.color = isError ? '#ff5555' : '#4CAF50';
    el.style.borderColor = isError ? '#800000' : '#005000';
    el.style.background = isError ? '#1a0000' : '#001a00';
}
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showTab(id, btn){
    ['prods','cats','ords'].forEach(x=>document.getElementById(x).classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
}

async function doLogin(){
    setStatus('جارٍ الدخول...');
    let em=document.getElementById('email').value.trim();
    try{ await auth.signInWithEmailAndPassword(em, document.getElementById('password').value); }
    catch(e){ setStatus('❌ فشل الدخول: '+e.message, true); }
}

async function doLogout(){ await auth.signOut(); location.reload(); }

auth.onAuthStateChanged(async u=>{
    if(!u){
        document.getElementById('app').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        setStatus('يرجى تسجيل الدخول', true);
        return;
    }
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    setStatus('✅ مرحباً بك: '+u.email);
    await loadAll();
});

async function loadAll(){
    try{ let s=await db.collection('products').get(); products=s.docs.map(d=>({id:d.id,...d.data()})); renderProds(); }catch(e){ setStatus('❌ خطأ في جلب المنتجات (تأكد من قواعد Firestore): '+e.message, true); }
    try{ let s=await db.collection('categories').get(); categories=s.docs.map(d=>({id:d.id,...d.data()})); renderCats(); }catch(e){}
    try{ let s=await db.collection('orders').get(); orders=s.docs.map(d=>({id:d.id,...d.data()})); renderOrds(); }catch(e){}
}

function renderProds(){
    document.getElementById('plist').innerHTML = products.map(p=>`
        <div class="item">
            ${p.images&&p.images[0]?'<img src="'+esc(p.images[0])+'" onerror="this.src=\'https://via.placeholder.com/60x60?text=No+Img\'">':'<div style="width:60px;height:60px;background:#222;border-radius:8px;"></div>'}
            <div class="item-info"><h4>${esc(p.name)}</h4><span>${esc(p.price)} ر.س</span></div>
            <div class="actions"><button class="btn-edit" onclick="editP('${p.id}')">تعديل</button><button class="btn-del" onclick="delP('${p.id}')">حذف</button></div>
        </div>`).join('') || '<p style="color:#888;">لا توجد منتجات مضافة.</p>';
}

function renderCats(){
    document.getElementById('pcat').innerHTML = '<option value="">بدون قسم</option>' + categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    document.getElementById('clist').innerHTML = categories.map(c=>`<div class="item"><div class="item-info"><h4>${esc(c.name)}</h4></div><button class="btn-del" onclick="delC('${c.id}')">حذف</button></div>`).join('') || '<p style="color:#888;">لا توجد أقسام مضافة.</p>';
}

function renderOrds(){
    document.getElementById('olist').innerHTML = orders.map(o=>`
        <div class="item">
            <div class="item-info"><h4>${esc(o.customer_name)}</h4><span>${esc(o.total)} ر.س</span></div>
            <select onchange="updOrd('${o.id}',this.value)" style="width:100px; margin:0; padding:5px; font-size:12px;">
                <option ${o.status==='جديد'?'selected':''}>جديد</option>
                <option ${o.status==='مكتمل'?'selected':''}>مكتمل</option>
            </select>
        </div>`).join('') || '<p style="color:#888;">لا توجد طلبات واردة.</p>';
}

// حفظ المنتج
async function doSaveProduct(){
    let name=document.getElementById('pname').value.trim();
    if(!name) return setStatus('⚠️ اكتب اسم المنتج أولاً', true);
    
    setStatus('⏳ جاري حفظ المنتج...');
    let payload={ 
        name, 
        price:Number(document.getElementById('pprice').value||0), 
        stock:Number(document.getElementById('pstock').value||0), 
        description:document.getElementById('pdesc').value, 
        category_id:document.getElementById('pcat').value||null, 
        images:[], 
        active:true 
    };
    
    try{
        let id=document.getElementById('pid').value;
        let ref;
        
        // 1. حفظ بيانات المنتج
        if(id){ await db.collection('products').doc(id).update(payload); ref={id}; }
        else { ref=await db.collection('products').add(payload); }
        
        // 2. رفع الصورة
        if(pendingFile){
            setStatus('⏳ جاري رفع الصورة...');
            try {
                let fileRef = storage.ref('products/'+Date.now()+'-'+pendingFile.name);
                await fileRef.put(pendingFile);
                let url = await fileRef.getDownloadURL();
                await db.collection('products').doc(ref.id).update({images:[url]});
            } catch(e) {
                return setStatus('⚠️ المنتج انحفظ، لكن الصورة فشلت! تأكد من قواعد Storage. الخطأ: '+e.message, true);
            }
        }
        
        setStatus('✅ تم حفظ المنتج والصورة بنجاح');
        clearP(); await loadAll();
    }catch(e){ setStatus('❌ فشل الحفظ: '+e.message, true); }
}

function editP(id){ 
    let p=products.find(x=>x.id===id); if(!p)return; 
    document.getElementById('pid').value=p.id; 
    document.getElementById('pname').value=p.name; 
    document.getElementById('pprice').value=p.price; 
    document.getElementById('pstock').value=p.stock; 
    document.getElementById('pdesc').value=p.description||'';
    document.getElementById('pcat').value=p.category_id||'';
    
    // إظهار الصورة القديمة في المعاينة
    if(p.images && p.images[0]) {
        let img = document.getElementById('previewImg');
        img.src = p.images[0];
        img.style.display = 'block';
    }
    window.scrollTo(0,0);
}

function clearP(){ 
    ['pid','pname','pprice','pdesc'].forEach(x=>document.getElementById(x).value=''); 
    document.getElementById('pstock').value='10'; 
    pendingFile=null; 
    document.getElementById('pimages').value=''; 
    document.getElementById('previewImg').style.display='none'; 
}
async function delP(id){ if(confirm('حذف المنتج؟')){ await db.collection('products').doc(id).delete(); loadAll(); } }

async function doSaveCat(){
    let n=document.getElementById('cname').value.trim();
    if(!n) return setStatus('⚠️ اكتب اسم القسم', true);
    try{ await db.collection('categories').add({name:n}); setStatus('✅ تم حفظ القسم'); document.getElementById('cname').value=''; await loadAll(); }
    catch(e){ setStatus('❌ فشل حفظ القسم: '+e.message, true); }
}
async function delC(id){ if(confirm('حذف القسم؟')){ await db.collection('categories').doc(id).delete(); loadAll(); } }
async function updOrd(id,st){ await db.collection('orders').doc(id).update({status:st}); loadAll(); setStatus('✅ تم تحديث الطلب'); }

// معاينة الصورة فور اختيارها
document.getElementById('pimages').addEventListener('change', e=>{ 
    pendingFile=e.target.files[0]; 
    if(pendingFile) {
        let img = document.getElementById('previewImg');
        img.src = URL.createObjectURL(pendingFile);
        img.style.display = 'block';
    }
});
</script>
</body>
</html>
