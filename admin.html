<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f0f; --panel: #1a1a1a; --pink: #d81b60; --text: #fff; --border: #333; }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: var(--pink); text-align: center; margin-bottom: 20px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { margin-top: 0; color: var(--pink); font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="file"], select, textarea { 
            width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; 
        }
        input[type="file"] { background: #222; }
        .btn { background: var(--pink); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #880e4f; }
        .btn-edit { background: #333; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; margin-left: 5px; font-size: 12px; }
        .btn-del { background: #8b0000; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-size: 12px; }
        .item { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #222; }
        .item-info { display: flex; align-items: center; gap: 10px; }
        .item-info img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid #444; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .status { text-align: center; color: yellow; font-weight: bold; margin-bottom: 15px; }
        @media(max-width: 600px) { .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 لوحة التحكم</h1>
    <div id="status" class="status">جاري الاتصال بقاعدة البيانات...</div>

    <!-- إدارة الأقسام -->
    <div class="card">
        <h2>📂 إدارة الأقسام</h2>
        <input type="hidden" id="edit_cat_id">
        <label>اسم القسم</label>
        <input type="text" id="cat_name" placeholder="مثال: ألعاب زوجية">
        <label>صورة القسم</label>
        <input type="file" id="cat_img" accept="image/*">
        <button class="btn" onclick="saveCategory()" id="btn_save_cat">إضافة القسم</button>
        <button class="btn" onclick="cancelEditCat()" id="btn_cancel_cat" style="display:none; background:#555; margin-top:10px;">إلغاء التعديل</button>
        
        <div id="cat_list" style="margin-top:20px;"></div>
    </div>

    <!-- إدارة المنتجات -->
    <div class="card">
        <h2>🛍️ إدارة المنتجات</h2>
        <input type="hidden" id="edit_prod_id">
        
        <label>اسم المنتج</label>
        <input type="text" id="prod_name" placeholder="اسم المنتج">
        
        <label>السعر (ر.س)</label>
        <input type="number" id="prod_price" placeholder="0.00">
        
        <label>القسم</label>
        <select id="prod_cat"></select>
        
        <label>الوصف</label>
        <textarea id="prod_desc" rows="3" placeholder="وصف المنتج..."></textarea>
        
        <label>صور المنتج (يمكنك اختيار 3 صور)</label>
        <div class="grid-3">
            <input type="file" id="prod_img1" accept="image/*">
            <input type="file" id="prod_img2" accept="image/*">
            <input type="file" id="prod_img3" accept="image/*">
        </div>
        
        <button class="btn" onclick="saveProduct()" id="btn_save_prod" style="margin-top:15px;">حفظ المنتج</button>
        <button class="btn" onclick="cancelEditProd()" id="btn_cancel_prod" style="display:none; background:#555; margin-top:10px;">إلغاء التعديل</button>

        <div id="prod_list" style="margin-top:20px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDWtBaLMtKzk9m4PdD3gOS281WCIMXf-fM",
        authDomain: "romance-store.firebaseapp.com",
        projectId: "romance-store",
        storageBucket: "romance-store.firebasestorage.app",
        messagingSenderId: "515216718722",
        appId: "1:515216718722:web:0acd950bef30a661886d9b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // سحب البيانات عند فتح الصفحة
    window.onload = async function() {
        try {
            document.getElementById('status').innerText = "✅ تم الاتصال بقاعدة البيانات";
            document.getElementById('status').style.color = "lightgreen";
            await loadCategories();
            await loadProducts();
        } catch(e) {
            document.getElementById('status').innerText = "❌ خطأ: " + e.message;
            document.getElementById('status').style.color = "red";
        }
    };

    // --- دوال مساعدة لرفع الصور ---
    async function uploadImage(file, folder) {
        if (!file) return null;
        const storageRef = ref(storage, `${folder}/${Date.now()}_${file.name}`);
        await uploadBytes(storageRef, file);
        return await getDownloadURL(storageRef);
    }

    // --- إدارة الأقسام ---
    window.saveCategory = async function() {
        let id = document.getElementById('edit_cat_id').value;
        let name = document.getElementById('cat_name').value;
        let file = document.getElementById('cat_img').files[0];
        let btn = document.getElementById('btn_save_cat');

        if(!name) return alert('اكتب اسم القسم');
        
        btn.innerText = 'جاري الحفظ...'; btn.disabled = true;
        try {
            let imgUrl = file ? await uploadImage(file, 'categories') : null;
            let data = { name: name };
            
            if (id) {
                if(imgUrl) data.image = imgUrl;
                await updateDoc(doc(db, "categories", id), data);
                alert('✅ تم تعديل القسم');
            } else {
                if(imgUrl) data.image = imgUrl;
                await addDoc(collection(db, "categories"), data);
                alert('✅ تم إضافة القسم');
            }
            cancelEditCat();
            await loadCategories();
        } catch(e) { alert('خطأ: ' + e.message); }
        btn.innerText = 'إضافة القسم'; btn.disabled = false;
    };

    window.editCategory = function(id, name) {
        document.getElementById('edit_cat_id').value = id;
        document.getElementById('cat_name').value = name;
        document.getElementById('btn_save_cat').innerText = 'تحديث القسم';
        document.getElementById('btn_cancel_cat').style.display = 'block';
        window.scrollTo(0,0);
    };

    window.cancelEditCat = function() {
        document.getElementById('edit_cat_id').value = '';
        document.getElementById('cat_name').value = '';
        document.getElementById('cat_img').value = '';
        document.getElementById('btn_save_cat').innerText = 'إضافة القسم';
        document.getElementById('btn_cancel_cat').style.display = 'none';
    };

    window.deleteCategory = async function(id) {
        if(!confirm('حذف القسم نهائياً؟')) return;
        await deleteDoc(doc(db, "categories", id));
        await loadCategories();
    };

    async function loadCategories() {
        const snap = await getDocs(collection(db, "categories"));
        let html = '';
        let options = '<option value="">اختر القسم</option>';
        
        snap.forEach(d => {
            let data = d.data();
            html += `
            <div class="item">
                <div class="item-info">
                    ${data.image ? `<img src="${data.image}">` : '📁'}
                    <b>${data.name}</b>
                </div>
                <div>
                    <button class="btn-edit" onclick="editCategory('${d.id}', '${data.name}')">تعديل</button>
                    <button class="btn-del" onclick="deleteCategory('${d.id}')">حذف</button>
                </div>
            </div>`;
            options += `<option value="${d.id}">${data.name}</option>`;
        });
        
        document.getElementById('cat_list').innerHTML = html || 'لا توجد أقسام.';
        document.getElementById('prod_cat').innerHTML = options;
    }

    // --- إدارة المنتجات ---
    window.saveProduct = async function() {
        let id = document.getElementById('edit_prod_id').value;
        let name = document.getElementById('prod_name').value;
        let price = document.getElementById('prod_price').value;
        let cat = document.getElementById('prod_cat').value;
        let desc = document.getElementById('prod_desc').value;
        
        let f1 = document.getElementById('prod_img1').files[0];
        let f2 = document.getElementById('prod_img2').files[0];
        let f3 = document.getElementById('prod_img3').files[0];
        
        let btn = document.getElementById('btn_save_prod');
        if(!name || !price) return alert('أكمل اسم المنتج والسعر');
        
        btn.innerText = 'جاري الرفع والحفظ...'; btn.disabled = true;
        try {
            let images = [];
            if(f1) images.push(await uploadImage(f1, 'products'));
            if(f2) images.push(await uploadImage(f2, 'products'));
            if(f3) images.push(await uploadImage(f3, 'products'));
            
            let data = { name, price: Number(price), category_id: cat, description: desc };
            
            if (id) {
                // إذا كان تعديل، نجيب الصور القديمة ونضيف عليها الجديدة
                const oldDoc = await getDoc(doc(db, "products", id));
                let oldImages = oldDoc.data().images || [];
                data.images = [...oldImages, ...images]; 
                await updateDoc(doc(db, "products", id), data);
                alert('✅ تم تعديل المنتج');
            } else {
                data.images = images;
                await addDoc(collection(db, "products"), data);
                alert('✅ تم إضافة المنتج');
            }
            
            cancelEditProd();
            await loadProducts();
        } catch(e) { alert('خطأ: ' + e.message); }
        btn.innerText = 'حفظ المنتج'; btn.disabled = false;
    };

    window.editProduct = async function(id) {
        const snap = await getDoc(doc(db, "products", id));
        if(!snap.exists()) return;
        let data = snap.data();
        
        document.getElementById('edit_prod_id').value = id;
        document.getElementById('prod_name').value = data.name;
        document.getElementById('prod_price').value = data.price;
        document.getElementById('prod_cat').value = data.category_id || '';
        document.getElementById('prod_desc').value = data.description || '';
        
        document.getElementById('btn_save_prod').innerText = 'تحديث المنتج';
        document.getElementById('btn_cancel_prod').style.display = 'block';
        window.scrollTo(0,0);
    };

    window.cancelEditProd = function() {
        document.getElementById('edit_prod_id').value = '';
        document.getElementById('prod_name').value = '';
        document.getElementById('prod_price').value = '';
        document.getElementById('prod_desc').value = '';
        document.getElementById('prod_img1').value = '';
        document.getElementById('prod_img2').value = '';
        document.getElementById('prod_img3').value = '';
        document.getElementById('btn_save_prod').innerText = 'حفظ المنتج';
        document.getElementById('btn_cancel_prod').style.display = 'none';
    };

    window.deleteProduct = async function(id) {
        if(!confirm('حذف المنتج نهائياً؟')) return;
        await deleteDoc(doc(db, "products", id));
        await loadProducts();
    };

    async function loadProducts() {
        const snap = await getDocs(collection(db, "products"));
        let html = '';
        snap.forEach(d => {
            let data = d.data();
            html += `
            <div class="item">
                <div class="item-info">
                    ${data.images && data.images[0] ? `<img src="${data.images[0]}">` : '🖼️'}
                    <div>
                        <b>${data.name}</b><br>
                        <span style="font-size:12px;color:#aaa">${data.price} ر.س</span>
                    </div>
                </div>
                <div>
                    <button class="btn-edit" onclick="editProduct('${d.id}')">تعديل</button>
                    <button class="btn-del" onclick="deleteProduct('${d.id}')">حذف</button>
                </div>
            </div>`;
        });
        document.getElementById('prod_list').innerHTML = html || 'لا توجد منتجات.';
    }
</script>
</body>
</html>
