<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم Firebase</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#0f0f0f;--red:#e50914;--gold:#d4af37;--text:#fff;--muted:#888;--border:#222;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial;display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0}
.logo{text-align:center;color:var(--gold);font-weight:900;font-size:20px;margin-bottom:30px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:14px 20px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;background:none;border:0;width:100%;text-align:right;cursor:pointer;transition:0.2s}
.nav-btn:hover,.nav-btn.active{background:#e5091422;color:var(--red);border-right:4px solid var(--red)}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:15px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.content-area{padding:20px;overflow-y:auto;flex:1}
.view{display:none}
.view.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-card h2{margin:10px 0 0;color:var(--red);font-size:28px}
.stat-card span{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin-bottom:10px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;font-family:inherit}
label{font-size:13px;color:#bbb;display:block;margin-bottom:5px}
.btn{background:var(--red);color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;width:100%}
.btn:hover{background:#b20710}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.item img{width:50px;height:50px;border-radius:6px;object-fit:cover}
.actions button{background:#333;color:#fff;border:0;padding:6px 12px;border-radius:6px;margin-left:5px;cursor:pointer;font-size:12px}
.actions button.danger{background:#8b0000}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-left:0;border-bottom:1px solid var(--border)}
  .logo{display:none}
  .nav-btn{white-space:nowrap;border-right:0;border-bottom:3px solid transparent;padding:10px}
  .nav-btn.active{border-right:0;border-bottom:3px solid var(--red)}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">👑 لوحة التحكم</div>
  <button class="nav-btn active" data-target="dash">🏠 الرئيسية</button>
  <button class="nav-btn" data-target="products">🛍️ المنتجات</button>
  <button class="nav-btn" data-target="orders">📦 الطلبات</button>
  <button class="nav-btn" data-target="categories">📂 الأقسام</button>
</div>

<div class="main-content">
  <div class="top-bar">
    <h3 style="margin:0">إدارة المتجر (Firebase)</h3>
  </div>

  <div class="content-area">
    <div id="view-dash" class="view active">
      <div class="stats-grid">
        <div class="stat-card"><span>المنتجات</span><h2 id="stat-p">0</h2></div>
        <div class="stat-card"><span>الطلبات</span><h2 id="stat-o">0</h2></div>
        <div class="stat-card"><span>طلبات جديدة</span><h2 id="stat-n">0</h2></div>
        <div class="stat-card"><span>الزوار</span><h2>0</h2></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">مرحباً بك</h3>
        <p style="color:var(--muted)">يمكنك إدارة متجرك بالكامل من هنا. تأكد من أنك رفعت الصور بشكل صحيح.</p>
      </div>
    </div>

    <div id="view-products" class="view">
      <div class="card">
        <h3 style="margin-top:0">إضافة منتج جديد</h3>
        <input type="hidden" id="prod_id">
        <label>اسم المنتج</label><input id="prod_name" placeholder="اسم المنتج">
        <div class="grid-2">
          <div><label>السعر (ر.س)</label><input id="prod_price" type="number"></div>
          <div><label>القسم</label><select id="prod_cat"></select></div>
        </div>
        <label>الوصف</label><textarea id="prod_desc" rows="2"></textarea>
        <label>صورة المنتج (ارفع من جهازك)</label>
        <input id="prod_file" type="file" accept="image/*" style="padding:10px; background:#222">
        <button class="btn" onclick="saveProduct()" style="margin-top:15px">حفظ المنتج</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0">المنتجات الحالية</h3>
        <div id="list-products"></div>
      </div>
    </div>

    <div id="view-orders" class="view">
      <div class="card">
        <h3 style="margin-top:0">الطلبات</h3>
        <div id="list-orders">جاري التحميل...</div>
      </div>
    </div>

    <div id="view-categories" class="view">
      <div class="card">
        <h3 style="margin-top:0">إضافة قسم جديد</h3>
        <label>اسم القسم</label><input id="cat_name">
        <label>أيقونة (إيموجي)</label><input id="cat_icon" placeholder="مثال: 🎁">
        <button class="btn" onclick="saveCategory()" style="margin-top:15px">حفظ القسم</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0">الأقسام الحالية</h3>
        <div id="list-cats"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWtBaLMtKzk9m4PdD3gOS281WCIMXf-fM",
  authDomain: "romance-store.firebaseapp.com",
  projectId: "romance-store",
  storageBucket: "romance-store.firebasestorage.app",
  messagingSenderId: "515216718722",
  appId: "1:515216718722:web:0acd950bef30a661886d9b",
  measurementId: "G-07KBTXL09Y"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let products = [], cats = [];

// التنقل بين الصفحات
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.target).classList.add('active');
  });
});

// تحميل البيانات
async function loadData() {
    const catSnap = await getDocs(collection(db, "categories"));
    cats = catSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
    document.getElementById('list-cats').innerHTML = cats.map(c => `
        <div class="item">
            <span>${c.icon} ${c.name}</span>
            <div class="actions"><button class="danger" onclick="window.deleteCat('${c.id}')">حذف</button></div>
        </div>
    `).join('') || 'لا توجد أقسام.';
    
    const catSelect = document.getElementById('prod_cat');
    catSelect.innerHTML = '<option value="">اختر القسم</option>' + cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

    const prodSnap = await getDocs(collection(db, "products"));
    products = prodSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
    document.getElementById('list-products').innerHTML = products.map(p => `
        <div class="item">
            <div style="display:flex;align-items:center;gap:10px">
                ${p.images?.[0] ? `<img src="${p.images[0]}">` : ''}
                <div><b>${p.name}</b><br><span style="color:var(--muted);font-size:12px">${p.price} ر.س</span></div>
            </div>
            <div class="actions"><button class="danger" onclick="window.deleteProd('${p.id}')">حذف</button></div>
        </div>
    `).join('') || 'لا توجد منتجات.';

    document.getElementById('stat-p').textContent = products.length;
    
    const orderSnap = await getDocs(collection(db, "orders"));
    let orders = orderSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
    document.getElementById('stat-o').textContent = orders.length;
    document.getElementById('stat-n').textContent = orders.filter(o => o.status === 'جديد').length;
    document.getElementById('list-orders').innerHTML = orders.map(o => `
        <div class="item" style="flex-direction:column;align-items:flex-start">
            <div><b>${o.customer_name}</b> - ${o.phone}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:5px">${o.city} - ${o.address}</div>
            <div style="font-size:12px;color:var(--red);margin-top:5px">الإجمالي: ${o.total} ر.س</div>
        </div>
    `).join('') || 'لا توجد طلبات.';
}

// حفظ المنتج
window.saveProduct = async function() {
    let name = document.getElementById('prod_name').value;
    let price = Number(document.getElementById('prod_price').value);
    let desc = document.getElementById('prod_desc').value;
    let catId = document.getElementById('prod_cat').value;
    let file = document.getElementById('prod_file').files[0];
    let btn = event.target;

    if(!name || !price) { alert('أكمل البيانات'); return; }
    btn.disabled = true; btn.textContent = 'جاري الرفع...';

    let imgUrl = '';
    if (file) {
        try {
            const storageRef = ref(storage, 'products/' + Date.now() + '_' + file.name);
            await uploadBytes(storageRef, file);
            imgUrl = await getDownloadURL(storageRef);
        } catch(e) {
            alert('خطأ في رفع الصورة: ' + e.message + '\nتأكد من تفعيل Storage والصلاحيات.');
            btn.disabled = false; btn.textContent = 'حفظ المنتج';
            return;
        }
    }

    await addDoc(collection(db, "products"), {
        name, price, description: desc, category_id: catId,
        images: imgUrl ? [imgUrl] : [], featured: false, active: true, created_at: new Date()
    });

    alert('✅ تم إضافة المنتج بنجاح');
    document.getElementById('prod_name').value = '';
    document.getElementById('prod_price').value = '';
    document.getElementById('prod_desc').value = '';
    document.getElementById('prod_file').value = '';
    btn.disabled = false; btn.textContent = 'حفظ المنتج';
    loadData();
};

// حفظ القسم
window.saveCategory = async function() {
    let name = document.getElementById('cat_name').value;
    let icon = document.getElementById('cat_icon').value || '🎁';
    if(!name) { alert('اكتب اسم القسم'); return; }
    
    await addDoc(collection(db, "categories"), { name, icon });
    alert('✅ تم إضافة القسم');
    document.getElementById('cat_name').value = '';
    document.getElementById('cat_icon').value = '';
    loadData();
};

// الحذف
window.deleteProd = async function(id) {
    if(!confirm('تأكيد الحذف؟')) return;
    await deleteDoc(doc(db, "products", id));
    loadData();
};
window.deleteCat = async function(id) {
    if(!confirm('تأكيد الحذف؟')) return;
    await deleteDoc(doc(db, "categories", id));
    loadData();
};

loadData();
</script>
</body></html>
