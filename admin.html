<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>لوحة تحكم المتجر</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root { --bg: #050505; --panel: #111; --red: #e50914; --gold: #d4af37; --text: #fff; --border: #252525; }
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

/* القائمة الجانبية */
.sidebar { width: 240px; background: #0a0a0a; border-left: 1px solid var(--border); position: fixed; height: 100%; right: 0; top: 0; overflow-y: auto; z-index: 10; }
.brand { text-align: center; padding: 20px; border-bottom: 1px solid var(--border); }
.brand h1 { color: var(--gold); font-size: 22px; margin: 0; }
.brand p { color: #fff; font-size: 11px; letter-spacing: 2px; }
.menu-item { padding: 15px 20px; cursor: pointer; color: #ccc; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #151515; transition: 0.2s; }
.menu-item:hover, .menu-item.active { background: var(--red); color: #fff; font-weight: bold; }

/* المحتوى */
.main { margin-right: 240px; padding: 20px; width: calc(100% - 240px); }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h2 { color: var(--gold); font-size: 20px; }
.user-email { color: #888; font-size: 13px; }

/* الكروت */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
h3 { color: var(--gold); margin-bottom: 15px; font-size: 16px; }

/* الحقول والأزرار */
input, select, textarea { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; margin-bottom: 12px; outline: none; }
input:focus, select:focus { border-color: var(--red); }
label { font-size: 13px; color: #bbb; display: block; margin-bottom: 5px; font-weight: bold; }
.btn { background: var(--red); color: #fff; border: 0; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
.btn:hover { background: #b80710; }
.btn-dark { background: #222; }

/* المنتجات */
.item { display: flex; align-items: center; gap: 15px; background: #080808; border: 1px solid var(--border); padding: 10px; border-radius: 10px; margin-bottom: 10px; }
.item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #222; }
.item-info { flex: 1; }
.item-info h4 { font-size: 15px; margin-bottom: 5px; }
.item-info span { color: var(--red); font-size: 14px; font-weight: bold; }
.actions { display: flex; gap: 5px; }
.actions button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; color: #fff; }
.btn-edit { background: #333; }
.btn-del { background: #800000; }

/* الإحصائيات */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.stat { background: #080808; border: 1px solid var(--border); padding: 15px; border-radius: 10px; text-align: center; }
.stat b { display: block; color: var(--red); font-size: 24px; }
.stat span { color: #aaa; font-size: 12px; }

#status { background: #1a0000; border: 1px solid var(--red); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
.hidden { display: none !important; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thumb { display: inline-block; margin: 5px; }
.thumb img { width: 60px; height: 60px; border-radius: 8px; border: 1px solid #333; object-fit: cover; }

/* شاشة الدخول */
#loginBox { max-width: 400px; margin: 50px auto; }

@media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; position: relative; height: auto; border-left: none; border-bottom: 1px solid var(--border); }
    .menu-item { padding: 12px; display: inline-block; width: 49%; text-align: center; border: 1px solid #222; margin: 2px 0; border-radius: 5px; }
    .main { margin-right: 0; width: 100%; padding: 10px; }
}
</style>
</head>
<body>

<!-- القائمة الجانبية -->
<div class="sidebar">
    <div class="brand"><h1>الرومانسية</h1><p>لوحة التحكم</p></div>
    <div class="menu-item active" onclick="showTab('dash',this)">📊 الرئيسية</div>
    <div class="menu-item" onclick="showTab('prods',this)">🛍️ المنتجات</div>
    <div class="menu-item" onclick="showTab('cats',this)">📂 الأقسام</div>
    <div class="menu-item" onclick="showTab('ords',this)">📦 الطلبات</div>
    <div class="menu-item" onclick="showTab('sets',this)">⚙️ الإعدادات</div>
    <div class="menu-item" onclick="doLogout()" style="color:#ff5555;">🚪 خروج</div>
</div>

<!-- المحتوى الرئيسي -->
<div class="main">
    <div id="status">مرحباً بك</div>

    <!-- تسجيل الدخول -->
    <div id="loginBox" class="card">
        <h2 style="color:var(--gold); text-align:center; margin-bottom:20px;">دخول المدير</h2>
        <label>البريد الإلكتروني</label>
        <input id="email" value="roooo77775@gmail.com">
        <label>كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••">
        <button class="btn" onclick="doLogin()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="app" class="hidden">
        <div class="header">
            <h2 id="pageTitle">الرئيسية</h2>
            <div class="user-email" id="adminEmail"></div>
        </div>

        <!-- الرئيسية -->
        <div id="dash">
            <div class="stats">
                <div class="stat"><b id="pcount">0</b><span>المنتجات</span></div>
                <div class="stat"><b id="ocount">0</b><span>الطلبات</span></div>
                <div class="stat"><b id="newcount">0</b><span>طلبات جديدة</span></div>
                <div class="stat"><b id="vcount">0</b><span>الزوار</span></div>
            </div>
            <div class="card"><h3>آخر الطلبات 🔥</h3><div id="recent"></div></div>
        </div>

        <!-- المنتجات -->
        <div id="prods" class="hidden">
            <div class="card">
                <h3>إضافة / تعديل منتج</h3>
                <input type="hidden" id="pid">
                <label>اسم المنتج</label><input id="pname" placeholder="اسم المنتج">
                <div class="grid2">
                    <div><label>السعر (ر.س)</label><input id="pprice" type="number"></div>
                    <div><label>المخزون</label><input id="pstock" type="number" value="10"></div>
                </div>
                <label>الوصف</label><textarea id="pdesc" rows="2"></textarea>
                <label>القسم</label><select id="pcat"><option value="">بدون قسم</option></select>
                <label>الصورة</label><input type="file" id="pimages" accept="image/*">
                <div id="pThumbs"></div>
                <button class="btn" onclick="doSaveProduct()">💾 حفظ المنتج</button>
                <button class="btn btn-dark" onclick="clearP()">مسح</button>
            </div>
            <div class="card">
                <h3>قائمة المنتجات</h3>
                <input id="searchP" placeholder="🔍 بحث..." oninput="renderProds()">
                <div id="plist"></div>
            </div>
        </div>

        <!-- الأقسام -->
        <div id="cats" class="hidden">
            <div class="card">
                <h3>إضافة قسم</h3>
                <input id="cname" placeholder="اسم القسم">
                <input id="cdesc" placeholder="الوصف">
                <input type="file" id="cimage" accept="image/*">
                <div id="cThumbs"></div>
                <button class="btn" onclick="doSaveCat()">💾 حفظ القسم</button>
            </div>
            <div class="card"><h3>الأقسام</h3><div id="clist"></div></div>
        </div>

        <!-- الطلبات -->
        <div id="ords" class="hidden">
            <div class="card">
                <h3>الطلبات</h3>
                <input id="searchO" placeholder="بحث بالاسم أو الجوال..." oninput="renderOrds()">
                <div id="olist"></div>
            </div>
        </div>

        <!-- الإعدادات -->
        <div id="sets" class="hidden">
            <div class="card">
                <h3>إعدادات المتجر</h3>
                <label>اسم المتجر</label><input id="sname">
                <label>الجوال</label><input id="sphone">
                <label>واتساب</label><input id="swa">
                <label>عنوان الواجهة</label><input id="stitle">
                <label>الوصف</label><textarea id="sdesc"></textarea>
                <button class="btn" onclick="doSaveSettings()">💾 حفظ الإعدادات</button>
            </div>
        </div>
    </div>
</div>

<script>
var authObj, dbObj, storageObj;
var firebaseConfig={apiKey:"AIzaSyDWtBaLMtKzk9m4PdD3gOS281WCIMXf-fM",authDomain:"romance-store.firebaseapp.com",projectId:"romance-store",storageBucket:"romance-store.firebasestorage.app",messagingSenderId:"515216718722",appId:"1:515216718722:web:0acd950bef30a661886d9b",measurementId:"G-07KBTXL09Y"};
try{ firebase.initializeApp(firebaseConfig); authObj=firebase.auth(); dbObj=firebase.firestore(); storageObj=firebase.storage(); }catch(e){ alert(e.message); }

var products=[], categories=[], orders=[], pendingFile=null, existingImages=[], catFile=null;

function setStatus(t){ var el=document.getElementById('status'); el.style.display='block'; el.textContent=t; }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showTab(id,btn){ 
    ['dash','prods','cats','ords','sets'].forEach(x=>document.getElementById(x).classList.add('hidden')); 
    document.getElementById(id).classList.remove('hidden'); 
    document.querySelectorAll('.menu-item').forEach(b=>b.classList.remove('active')); 
    if(btn) btn.classList.add('active'); 
    var titles={dash:'الرئيسية',prods:'المنتجات',cats:'الأقسام',ords:'الطلبات',sets:'الإعدادات'};
    document.getElementById('pageTitle').textContent=titles[id];
}

async function doLogin(){ setStatus('جارٍ الدخول...'); var em=document.getElementById('email').value.trim(); if(!em.includes('@')) em=em+'@gmail.com'; try{ await authObj.signInWithEmailAndPassword(em, document.getElementById('password').value); }catch(e){ setStatus('❌ فشل: '+e.message); } }
async function doLogout(){ await authObj.signOut(); location.reload(); }

authObj.onAuthStateChanged(async u=>{ 
    if(!u){ document.getElementById('app').classList.add('hidden'); document.getElementById('loginBox').classList.remove('hidden'); return; } 
    document.getElementById('loginBox').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); 
    document.getElementById('adminEmail').textContent=u.email; setStatus('✅ أهلاً '+u.email); 
    loadProds(); loadCats(); loadOrds(); loadSets();
});

async function loadProds(){ try{ var s=await dbObj.collection('products').get(); products=s.docs.map(d=>({id:d.id,...d.data()})); renderProds(); renderDash(); }catch(e){} }
async function loadCats(){ try{ var s=await dbObj.collection('categories').get(); categories=s.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('pcat').innerHTML='<option value="">بدون قسم</option>'+categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join(''); renderCats(); }catch(e){} }
async function loadOrds(){ try{ var s=await dbObj.collection('orders').get(); orders=s.docs.map(d=>({id:d.id,...d.data()})); renderOrds(); renderDash(); }catch(e){} }
async function loadSets(){ try{ var doc=await dbObj.collection('settings').doc('1').get(); if(doc.exists){ var v=doc.data(); document.getElementById('sname').value=v.store_name||''; document.getElementById('sphone').value=v.phone||''; document.getElementById('swa').value=v.whatsapp||''; document.getElementById('stitle').value=v.hero_title||''; document.getElementById('sdesc').value=v.hero_description||''; } }catch(e){} }

function renderDash(){ 
    document.getElementById('pcount').textContent=products.length; 
    document.getElementById('ocount').textContent=orders.length; 
    document.getElementById('newcount').textContent=orders.filter(o=>o.status==='جديد').length; 
    document.getElementById('recent').innerHTML=orders.slice(0,3).map(o=>'<div class="item"><div class="item-info"><h4>'+esc(o.customer_name)+'</h4><span>'+esc(o.status)+'</span></div></div>').join('')||'لا يوجد طلبات'; 
}

function renderProds(){ 
    var q=(document.getElementById('searchP').value||'').toLowerCase(); 
    var list=products.filter(p=>String(p.name||'').toLowerCase().includes(q)); 
    document.getElementById('plist').innerHTML=list.map(p=>`
        <div class="item">
            ${p.images&&p.images[0]?'<img src="'+esc(p.images[0])+'">':'<div style="width:60px;height:60px;background:#222;border-radius:8px;"></div>'}
            <div class="item-info"><h4>${esc(p.name)}</h4><span>${esc(p.price)} ر.س</span></div>
            <div class="actions"><button class="btn-edit" onclick="editP('${p.id}')">تعديل</button><button class="btn-del" onclick="delP('${p.id}')">حذف</button></div>
        </div>`).join('')||'لا توجد منتجات'; 
}

function renderCats(){ document.getElementById('clist').innerHTML=categories.map(c=>'<div class="item"><div class="item-info"><h4>'+esc(c.name)+'</h4></div><button class="btn-del" onclick="delC(\''+c.id+'\')">حذف</button></div>').join('')||'لا توجد أقسام'; }
function renderOrds(){ document.getElementById('olist').innerHTML=orders.map(o=>'<div class="item"><div class="item-info"><h4>'+esc(o.customer_name)+'</h4><span>'+esc(o.total)+' ر.س</span></div><select onchange="updOrd(\''+o.id+'\',this.value)" style="width:100px;margin:0;"><option>جديد</option><option>مكتمل</option></select></div>').join('')||'لا توجد طلبات'; }

// رفع الصور
async function upFile(file, folder){ 
    var r=storageObj.ref().child(folder+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.]/g,'_')); 
    await r.put(file); return await r.getDownloadURL(); 
}

// حفظ المنتج
async function doSaveProduct(){ 
    var name=document.getElementById('pname').value.trim(); if(!name) return setStatus('اكتب اسم المنتج'); 
    setStatus('جارٍ الحفظ...'); 
    var payload={ name:name, price:Number(document.getElementById('pprice').value||0), stock:Number(document.getElementById('pstock').value||0), description:document.getElementById('pdesc').value, category_id:document.getElementById('pcat').value||null, images:[...existingImages], active:true, updated_at: firebase.firestore.FieldValue.serverTimestamp() }; 
    
    try{ 
        var id=document.getElementById('pid').value; var ref; 
        if(id){ await dbObj.collection('products').doc(id).update(payload); ref={id:id}; } 
        else { payload.created_at=firebase.firestore.FieldValue.serverTimestamp(); ref=await dbObj.collection('products').add(payload); } 
        
        setStatus('✅ انحفظ المنتج الأساسي'); 
        
        if(pendingFile){ 
            try{ 
                setStatus('⏳ جاري رفع الصورة...'); 
                var url=await upFile(pendingFile,'products'); 
                await dbObj.collection('products').doc(ref.id).update({images:[...payload.images,url]}); 
                setStatus('✅ تم حفظ المنتج والصورة بنجاح!'); 
            }catch(e){ 
                setStatus('⚠️ المنتج انحفظ، لكن الصورة فشلت! السبب: '+(e.message||'مشكلة في قواعد Firebase Storage')); 
                return; 
            } 
        } 
        clearP(); loadProds(); 
    }catch(e){ setStatus('❌ فشل: '+e.message); } 
}

function editP(id){ var p=products.find(x=>x.id===id); if(!p)return; document.getElementById('pid').value=p.id; document.getElementById('pname').value=p.name||''; document.getElementById('pprice').value=p.price||''; document.getElementById('pstock').value=p.stock||''; document.getElementById('pdesc').value=p.description||''; document.getElementById('pcat').value=p.category_id||''; existingImages=[...(p.images||[])]; renderPThumbs(); showTab('prods',document.querySelectorAll('.menu-item')[1]); }
function clearP(){ ['pid','pname','pprice','pstock','pdesc'].forEach(x=>document.getElementById(x).value=''); pendingFile=null; existingImages=[]; renderPThumbs(); }
async function delP(id){ if(!confirm('حذف؟'))return; await dbObj.collection('products').doc(id).delete(); loadProds(); }

async function doSaveCat(){ 
    var n=document.getElementById('cname').value; if(!n)return setStatus('اكتب اسم القسم'); 
    try{ var ref=await dbObj.collection('categories').add({name:n,description:document.getElementById('cdesc').value,image_url:''}); 
    if(catFile){ try{ var u=await upFile(catFile,'categories'); await dbObj.collection('categories').doc(ref.id).update({image_url:u}); setStatus('✅ تم حفظ القسم والصورة'); }catch(e){ setStatus('⚠️ القسم انحفظ بدون صورة. السبب: '+e.message); } } 
    document.getElementById('cname').value=''; catFile=null; loadCats(); }catch(e){ setStatus('❌ '+e.message); } 
}
async function delC(id){ if(confirm('حذف القسم؟')){ await dbObj.collection('categories').doc(id).delete(); loadCats(); } }
async function updOrd(id,st){ await dbObj.collection('orders').doc(id).update({status:st}); loadOrds(); setStatus('✅ تم تحديث الطلب'); }

async function doSaveSettings(){ 
    try{ await dbObj.collection('settings').doc('1').set({store_name:document.getElementById('sname').value,phone:document.getElementById('sphone').value,whatsapp:document.getElementById('swa').value,hero_title:document.getElementById('stitle').value,hero_description:document.getElementById('sdesc').value},{merge:true}); setStatus('✅ تم حفظ الإعدادات'); }catch(e){ setStatus('❌ '+e.message); } 
}

function renderPThumbs(){ document.getElementById('pThumbs').innerHTML=existingImages.map(u=>'<div class="thumb"><img src="'+esc(u)+'"></div>').join('')+(pendingFile?'<div class="thumb"><img src="'+URL.createObjectURL(pendingFile)+'"></div>':''); }
document.getElementById('pimages').addEventListener('change',e=>{ pendingFile=e.target.files[0]; renderPThumbs(); });
document.getElementById('cimage').addEventListener('change',e=>{ catFile=e.target.files[0]; document.getElementById('cThumbs').innerHTML='<div class="thumb"><img src="'+URL.createObjectURL(catFile)+'"></div>'; });
</script>
</body>
</html>
