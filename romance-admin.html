<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROMANCE STORE | لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
:root{--bg:#080808;--panel:#151515;--gold:#d6b56d;--red:#a91d35;--line:#302923}*{box-sizing:border-box;font-family:Tajawal,Arial}body{margin:0;background:var(--bg);color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.hidden{display:none!important}.top{padding:18px;border:1px solid #57452c;border-radius:15px;background:linear-gradient(120deg,#302315,#111);margin-bottom:16px}.top h1{color:var(--gold);margin:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}h2,h3{color:var(--gold)}label{display:block;color:#ccc;font-size:13px;margin:10px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid #39332d;background:#090909;color:white;margin-bottom:8px}input[type=file]{padding:9px}.btn{border:0;border-radius:9px;background:linear-gradient(110deg,#94172e,#c13a4b);color:#fff;padding:12px 15px;font-weight:800;cursor:pointer;width:100%;margin:5px 0}.btn.gold{background:linear-gradient(110deg,#9c783a,#dfc27e);color:#17120a}.btn.dark{background:#292421}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tab{background:#211d19;color:#ddd;border:1px solid #45392a;border-radius:9px;padding:11px 3px;font-weight:bold}.tab.active{background:#8e1c31;color:#fff}.item{display:flex;gap:10px;align-items:center;border:1px solid #302923;background:#0d0d0d;border-radius:10px;padding:10px;margin:9px 0}.item img{width:58px;height:58px;object-fit:cover;border-radius:8px}.info{flex:1}.info b{display:block}.info small{color:var(--gold)}.actions{display:flex;gap:5px}.actions button{border:0;border-radius:6px;padding:7px;background:#39312a;color:white}.actions .del{background:#781a2b}.status{display:none;padding:12px;border-radius:9px;background:#19130c;color:var(--gold);margin:10px 0;overflow-wrap:anywhere}.preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.preview img{width:75px;height:75px;object-fit:cover;border:1px solid var(--gold);border-radius:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d0d0d;border:1px solid var(--line);padding:12px;border-radius:10px;text-align:center}.stat strong{display:block;color:var(--gold);font-size:22px}@media(max-width:480px){.tabs{grid-template-columns:repeat(2,1fr)}.actions{flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><h1>👑 الرومانسية</h1><div>ROMANCE STORE</div><div>لوحة إدارة المتجر — إصدار PRO</div></div><div id="status" class="status"></div>
<div id="login" class="card"><h2>تسجيل دخول المدير</h2><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button class="btn gold" onclick="login()">دخول آمن</button></div>
<div id="app" class="hidden"><div class="stats"><div class="stat">المنتجات<strong id="statP">0</strong></div><div class="stat">الأقسام<strong id="statC">0</strong></div><div class="stat">الطلبات<strong id="statO">0</strong></div></div>
<div class="card"><div class="tabs"><button class="tab active" onclick="tab('products',this)">🛍️ المنتجات</button><button class="tab" onclick="tab('categories',this)">▦ الأقسام</button><button class="tab" onclick="tab('orders',this)">📦 الطلبات</button><button class="tab" onclick="tab('settings',this)">⚙️ الإعدادات</button></div></div>
<section id="products" class="card"><h2>إضافة / تعديل منتج</h2><input type="hidden" id="pid"><label>اسم المنتج</label><input id="pname" placeholder="اسم المنتج"><div style="display:flex;gap:8px"><div style="flex:1"><label>السعر</label><input id="price" type="number" min="0"></div><div style="flex:1"><label>المخزون</label><input id="stock" type="number" min="0" value="10"></div></div><label>الوصف</label><textarea id="desc" rows="3"></textarea><label>القسم</label><select id="pcat"><option value="">بدون قسم</option></select><label>صور المنتج (يمكن اختيار عدة صور)</label><input id="pfiles" type="file" accept="image/*" multiple><div id="pPreview" class="preview"></div><label><input id="featured" type="checkbox" style="width:auto"> عرض ضمن المنتجات المميزة</label><button class="btn gold" onclick="saveProduct()">حفظ المنتج والصور</button><button class="btn dark" onclick="clearProduct()">تفريغ الحقول</button><h3>المنتجات الحالية</h3><div id="plist"></div></section>
<section id="categories" class="card hidden"><h2>إدارة الأقسام</h2><input type="hidden" id="cid"><label>اسم القسم</label><input id="cname" placeholder="مثال: هدايا وديكورات"><label>صورة القسم</label><input id="cfile" type="file" accept="image/*"><div id="cPreview" class="preview"></div><button class="btn gold" onclick="saveCategory()">حفظ القسم والصورة</button><button class="btn dark" onclick="clearCategory()">قسم جديد</button><h3>الأقسام الحالية</h3><div id="clist"></div></section>
<section id="orders" class="card hidden"><h2>الطلبات الواردة</h2><div id="olist"></div></section>
<section id="settings" class="card hidden"><h2>إعدادات المتجر</h2><label>اسم المتجر بالعربية</label><input id="sname"><label>اسم المتجر بالإنجليزية</label><input id="snameEn"><label>عنوان الواجهة</label><input id="stitle"><label>وصف الواجهة</label><textarea id="sdesc" rows="3"></textarea><label>شريط الإعلان</label><input id="sannounce"><label>اللون الذهبي (مثال #d6b56d)</label><input id="scolor" value="#d6b56d"><button class="btn gold" onclick="saveSettings()">حفظ الإعدادات</button><button class="btn dark" onclick="logout()">تسجيل الخروج</button></section>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDWtBaLMtKzk9m4PdD3gOS281WCIMXf-fM",authDomain:"romance-store.firebaseapp.com",projectId:"romance-store",storageBucket:"romance-store.firebasestorage.app",messagingSenderId:"515216718722",appId:"1:515216718722:web:0acd950bef30a661886d9b",measurementId:"G-07KBTXL09Y"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();let products=[],categories=[],orders=[],productFiles=[],categoryFile=null,oldImages=[];
const $=id=>document.getElementById(id);
function msg(t,bad=false){$('status').style.display='block';$('status').textContent=t;$('status').style.color=bad?'#ff8585':'#e0c27b'}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function login(){try{msg('جارٍ تسجيل الدخول...');await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){msg('فشل تسجيل الدخول: '+e.message,true)}}
async function logout(){await auth.signOut()}
auth.onAuthStateChanged(async u=>{ $('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(u){msg('تم تسجيل الدخول: '+u.email);await loadAll()}});
function tab(id,b){['products','categories','orders','settings'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function loadAll(){try{let [p,c,o,s]=await Promise.all([db.collection('products').get(),db.collection('categories').get(),db.collection('orders').orderBy('created_at','desc').get(),db.collection('settings').doc('1').get()]);products=p.docs.map(d=>({id:d.id,...d.data()}));categories=c.docs.map(d=>({id:d.id,...d.data()}));orders=o.docs.map(d=>({id:d.id,...d.data()}));$('statP').textContent=products.length;$('statC').textContent=categories.length;$('statO').textContent=orders.length;renderProducts();renderCategories();renderOrders();renderCatSelect();if(s.exists){let x=s.data();$('sname').value=x.store_name||'';$('snameEn').value=x.store_name_en||'';$('stitle').value=x.hero_title||'';$('sdesc').value=x.hero_description||'';$('sannounce').value=x.announcement||'';$('scolor').value=x.primary_color||'#d6b56d'}}catch(e){msg('تعذر تحميل البيانات: '+e.message,true)}}
function renderCatSelect(){$('pcat').innerHTML='<option value="">بدون قسم</option>'+categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
function renderProducts(){$('plist').innerHTML=products.map(p=>`<div class="item">${p.images?.[0]?`<img src="${esc(p.images[0])}">`:'<div style="width:58px;height:58px;background:#222;border-radius:8px"></div>'}<div class="info"><b>${esc(p.name)}</b><small>${Number(p.price||0)} ر.س · ${(p.images||[]).length} صورة</small></div><div class="actions"><button onclick="editProduct('${p.id}')">تعديل</button><button class="del" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join('')||'<p>لا توجد منتجات بعد.</p>'}
function renderCategories(){$('clist').innerHTML=categories.map(c=>`<div class="item">${c.image_url?`<img src="${esc(c.image_url)}">`:'<div style="width:58px;height:58px;background:#222;border-radius:8px"></div>'}<div class="info"><b>${esc(c.name)}</b></div><div class="actions"><button onclick="editCategory('${c.id}')">تعديل</button><button class="del" onclick="deleteCategory('${c.id}')">حذف</button></div></div>`).join('')||'<p>لا توجد أقسام.</p>'}
function renderOrders(){$('olist').innerHTML=orders.map(o=>`<div class="item" style="align-items:flex-start"><div class="info"><b>${esc(o.customer_name||'عميل')}</b><small>${esc(o.phone||'')} · ${esc(o.city||'')}</small><p>${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</p><b>${Number(o.total||0)} ر.س</b></div><select style="width:110px" onchange="updateOrder('${o.id}',this.value)"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='مكتمل'?'selected':''}>مكتمل</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select></div>`).join('')||'<p>لا توجد طلبات.</p>'}
async function upload(file,path){let ref=storage.ref(path+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'));await ref.put(file);return await ref.getDownloadURL()}
async function saveProduct(){let name=$('pname').value.trim();if(!name)return msg('اكتب اسم المنتج أولاً',true);try{msg('جارٍ حفظ بيانات المنتج...');let id=$('pid').value;let images=[...oldImages];for(let f of productFiles){msg('جارٍ رفع الصورة: '+f.name);images.push(await upload(f,'products'))}let data={name,price:Number($('price').value||0),stock:Number($('stock').value||0),description:$('desc').value,category_id:$('pcat').value||null,images,featured:$('featured').checked,active:true,updated_at:firebase.firestore.FieldValue.serverTimestamp()};if(id)await db.collection('products').doc(id).set(data,{merge:true});else await db.collection('products').add({...data,created_at:firebase.firestore.FieldValue.serverTimestamp()});msg('تم حفظ المنتج والصور بنجاح');clearProduct();await loadAll()}catch(e){msg('فشل الحفظ أو رفع الصورة: '+e.message,true)}}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;$('pid').value=p.id;$('pname').value=p.name||'';$('price').value=p.price||0;$('stock').value=p.stock??10;$('desc').value=p.description||'';$('pcat').value=p.category_id||'';$('featured').checked=!!p.featured;oldImages=p.images||[];productFiles=[];$('pPreview').innerHTML=oldImages.map(u=>`<img src="${esc(u)}">`).join('');window.scrollTo(0,0)}
function clearProduct(){$('pid').value='';['pname','price','desc'].forEach(x=>$(x).value='');$('stock').value=10;$('pcat').value='';$('featured').checked=false;$('pfiles').value='';$('pPreview').innerHTML='';productFiles=[];oldImages=[]}
async function deleteProduct(id){if(!confirm('حذف المنتج؟'))return;try{await db.collection('products').doc(id).delete();msg('تم حذف المنتج');await loadAll()}catch(e){msg(e.message,true)}}
$('pfiles').addEventListener('change',e=>{productFiles=[...e.target.files];$('pPreview').innerHTML=oldImages.map(u=>`<img src="${esc(u)}">`).join('')+productFiles.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')});
async function saveCategory(){let name=$('cname').value.trim();if(!name)return msg('اكتب اسم القسم',true);try{msg('جارٍ حفظ القسم...');let id=$('cid').value,data={name};if(categoryFile)data.image_url=await upload(categoryFile,'categories');if(id)await db.collection('categories').doc(id).set(data,{merge:true});else await db.collection('categories').add(data);msg('تم حفظ القسم وصورته');clearCategory();await loadAll()}catch(e){msg('تعذر حفظ القسم: '+e.message,true)}}
function editCategory(id){let c=categories.find(x=>x.id===id);$('cid').value=c.id;$('cname').value=c.name;$('cPreview').innerHTML=c.image_url?`<img src="${esc(c.image_url)}">`:'';categoryFile=null;window.scrollTo(0,0)}
function clearCategory(){$('cid').value='';$('cname').value='';$('cfile').value='';$('cPreview').innerHTML='';categoryFile=null}
$('cfile').addEventListener('change',e=>{categoryFile=e.target.files[0]||null;$('cPreview').innerHTML=categoryFile?`<img src="${URL.createObjectURL(categoryFile)}">`:''});
async function deleteCategory(id){if(!confirm('حذف القسم؟'))return;try{await db.collection('categories').doc(id).delete();msg('تم حذف القسم');await loadAll()}catch(e){msg(e.message,true)}}
async function updateOrder(id,status){try{await db.collection('orders').doc(id).update({status});msg('تم تحديث حالة الطلب');await loadAll()}catch(e){msg(e.message,true)}}
async function saveSettings(){try{await db.collection('settings').doc('1').set({store_name:$('sname').value.trim(),store_name_en:$('snameEn').value.trim(),hero_title:$('stitle').value.trim(),hero_description:$('sdesc').value.trim(),announcement:$('sannounce').value.trim(),primary_color:$('scolor').value.trim()||'#d6b56d',updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});msg('تم حفظ إعدادات المتجر')}catch(e){msg('فشل حفظ الإعدادات: '+e.message,true)}}
</script></body></html>
